services:
  dash_app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    # Fallback resolvers: some rootless-Podman networks (aardvark-dns) intermittently
    # fail to forward external DNS queries; app.py also retries on startup.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      internal:
        aliases:
          - dash_backend
    environment:
      - APP_SUBPATH=${APP_SUBPATH:-}
      - DASHBOARD_ROUTES_PATHNAME_PREFIX=${DASHBOARD_ROUTES_PATHNAME_PREFIX:-/dashboard/}
      - DASHBOARD_REQUESTS_PATHNAME_PREFIX=${DASHBOARD_REQUESTS_PATHNAME_PREFIX:-}
      - STATIC_SITE_BASE_URL=${STATIC_SITE_BASE_URL:-}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - dash_app
    ports:
      - "${HTTP_PORT:-8000}:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge
