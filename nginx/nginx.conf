server {
    listen 80;
    # server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static frontend (HTML/CSS/JS/images).
    location / {
        try_files $uri $uri/ =404;
    }

    # location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ {
    #     try_files $uri =404;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800, immutable";
    # }

    # Reverse proxy to the Dash/Gunicorn app; keep the /dashboard/ prefix as-is
    # to match Dash's requests_pathname_prefix.
    # ^~ stops the static-asset regex location below from intercepting Dash's
    # own .js/.css bundles (e.g. /dashboard/_dash-component-suites/...), which
    # otherwise returns Nginx's HTML 404 page and breaks JS parsing in the browser.
    location ^~ /dashboard/ {
        proxy_pass http://dash_backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
